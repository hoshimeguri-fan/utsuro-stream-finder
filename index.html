<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>氷室うつろ 配信アーカイブ診断</title>
  <style>
    :root {
      --bg-color: #12141a;
      --card-bg: #1c202a;
      --accent: #5e81ac;
      --accent-hover: #81a1c1;
      --text: #eceff4;
      --text-sub: #d8dee9;
      --border: #2e3440;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
    }
    body {
      background-color: var(--bg-color);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .container {
      width: 100%;
      max-width: 580px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px 18px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
    }
    header {
      text-align: center;
      margin-bottom: 18px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }
    h1 {
      font-size: 1.25rem;
      color: var(--accent-hover);
      letter-spacing: 1px;
      margin-bottom: 4px;
    }
    .subtitle {
      font-size: 0.8rem;
      color: var(--text-sub);
    }
    .character-img-wrap {
      text-align: center;
      margin-bottom: 14px;
    }
    .character-img {
      max-height: 160px;
      max-width: 100%;
      object-fit: contain;
      border-radius: 8px;
      display: inline-block;
    }
    .question-title {
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.5;
      margin-bottom: 16px;
      text-align: center;
    }
    .options-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    button.option-btn {
      background: #252b38;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 12px 16px;
      border-radius: 8px;
      text-align: left;
      font-size: 0.9rem;
      line-height: 1.3;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    button.option-btn:hover {
      background: var(--accent);
      border-color: var(--accent-hover);
      transform: translateY(-2px);
    }
    .result-box {
      display: none;
      text-align: center;
    }
    .result-badge {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      font-size: 0.75rem;
      padding: 3px 12px;
      border-radius: 20px;
      margin-bottom: 12px;
    }
    .result-title {
      font-size: 1.2rem;
      color: #88c0d0;
      margin-bottom: 14px;
      line-height: 1.4;
    }
    .thumb-wrap {
      margin-bottom: 16px;
    }
    .thumb-img {
      width: 100%;
      max-width: 440px;
      border-radius: 8px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }
    .result-desc {
      font-size: 0.88rem;
      color: var(--text-sub);
      line-height: 1.6;
      text-align: left;
      background: #232834;
      padding: 14px;
      border-radius: 8px;
      margin-bottom: 18px;
      border-left: 4px solid var(--accent);
    }
    .yt-link {
      display: inline-block;
      background: #bf616a;
      color: #fff;
      text-decoration: none;
      padding: 12px 18px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.88rem;
      transition: opacity 0.2s ease;
      width: 100%;
      max-width: 360px;
    }
    .yt-link:hover {
      opacity: 0.85;
    }
    .retry-btn {
      background: transparent;
      color: var(--text-sub);
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      margin-top: 12px;
    }
    .retry-btn:hover {
      background: var(--border);

</head>

        <button class="retry-btn" onclick="restartQuiz()">もう一度診断する</button>

    // 質問描画ロジック
    function renderQuestion(nodeId) {
      const node = nodes[nodeId];
      if (!node) return;

      // 氷室うつろ画像の設定
      const charImg = document.getElementById("char-img");
      if (node.image) {
        charImg.src = node.image;
        charImg.style.display = "inline-block";
        charImg.onerror = () => { charImg.style.display = "none"; };
      } else {
        charImg.style.display = "none";
      }

      document.getElementById("question-text").innerText = node.text;
      const optionsContainer = document.getElementById("options-container");
      optionsContainer.innerHTML = "";

      node.options.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerText = opt.label;
        btn.onclick = () => {
          if (opt.result) {
            showResult(opt.result);
          } else if (opt.next) {
            renderQuestion(opt.next);
          }
        };
        optionsContainer.appendChild(btn);
      });
    }

    // 結果表示ロジック（該当シリーズ初回配信のサムネイルを確実に表示）
    function showResult(resultKey) {
      const res = resultsData[resultKey];
      if (!res) return;

      document.getElementById("quiz-area").style.display = "none";
      const resultArea = document.getElementById("result-area");
      resultArea.style.display = "block";

      document.getElementById("result-title").innerText = res.title;
      document.getElementById("result-desc").innerText = res.desc;

      // 当該シリーズ第1回アーカイブのサムネイルを表示
      const thumbImg = document.getElementById("result-thumb");
      thumbImg.src = `https://img.youtube.com/vi/${res.videoId}/hqdefault.jpg`;

      // 当該シリーズ第1回アーカイブへのURLを設定
      const resultLink = document.getElementById("result-link");
      resultLink.href = `https://www.youtube.com/watch?v=${res.videoId}`;
    }

    function restartQuiz() {
      document.getElementById("result-area").style.display = "none";
      document.getElementById("quiz-area").style.display = "block";
      renderQuestion("root");
    }
