<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>氷室うつろ 配信アーカイブ診断</title>
  <style>
    :root {
      --bg-color: #12141a;
      --card-bg: #1c202a;
      --accent: #5e81ac;
      --accent-hover: #81a1c1;
      --text: #eceff4;
      --text-sub: #d8dee9;
      --border: #2e3440;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
    }
    body {
      background-color: var(--bg-color);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 650px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px 20px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
    }
    header {
      text-align: center;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 14px;
    }
    h1 {
      font-size: 1.3rem;
      color: var(--accent-hover);
      letter-spacing: 1px;
      margin-bottom: 6px;
    }
    .subtitle {
      font-size: 0.85rem;
      color: var(--text-sub);
    }
    /* 氷室うつろ画像エリア */
    .character-img-wrap {
      text-align: center;
      margin-bottom: 18px;
    }
    .character-img {
      max-height: 180px;
      max-width: 100%;
      object-fit: contain;
      border-radius: 8px;
      display: inline-block;
    }
    .question-title {
      font-size: 1.05rem;
      font-weight: 600;
      line-height: 1.5;
      margin-bottom: 18px;
      text-align: center;
    }
    .options-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    button.option-btn {
      background: #252b38;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 13px 16px;
      border-radius: 8px;
      text-align: left;
      font-size: 0.9rem;
      line-height: 1.4;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    button.option-btn:hover {
      background: var(--accent);
      border-color: var(--accent-hover);
      transform: translateY(-2px);
    }
    /* 結果表示エリア */
    .result-box {
      display: none;
      text-align: center;
    }
    .result-badge {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      font-size: 0.75rem;
      padding: 3px 12px;
      border-radius: 20px;
      margin-bottom: 12px;
    }
    .result-title {
      font-size: 1.25rem;
      color: #88c0d0;
      margin-bottom: 14px;
      line-height: 1.4;
    }
    .thumb-wrap {
      margin-bottom: 16px;
    }
    .thumb-img {
      width: 100%;
      max-width: 480px;
      border-radius: 8px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }
    .result-desc {
      font-size: 0.9rem;
      color: var(--text-sub);
      line-height: 1.6;
      text-align: left;
      background: #232834;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      border-left: 4px solid var(--accent);
    }
    .yt-link {
      display: inline-block;
      background: #bf616a;
      color: #fff;
      text-decoration: none;
      padding: 12px 20px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.9rem;
      transition: opacity 0.2s ease;
      width: 100%;
      max-width: 400px;
    }
    .yt-link:hover {
      opacity: 0.85;
    }
    .retry-btn {
      background: transparent;
      color: var(--text-sub);
      border: 1px solid var(--border);
      padding: 9px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      margin-top: 14px;
    }
    .retry-btn:hover {
      background: var(--border);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>氷室うつろ 配信アーカイブ診断</h1>
      <p class="subtitle">…旦那様、今のあなたに必要な配信をお選びいたします。</p>
    </header>

    <div id="quiz-area">
      <div class="character-img-wrap">
        <img id="char-img" class="character-img" src="" alt="氷室うつろ" style="display:none;">
      </div>
      <div class="question-box">
        <div id="question-text" class="question-title">読み込み中…</div>
        <div id="options-container" class="options-list"></div>
      </div>
    </div>

    <div id="result-area" class="result-box">
      <span class="result-badge">おすすめのアーカイブ</span>
      <h2 id="result-title" class="result-title"></h2>
      
      <!-- 当該シリーズ初回配信のサムネイル表示 -->
      <div class="thumb-wrap">
        <img id="result-thumb" class="thumb-img" src="" alt="初回配信サムネイル">
      </div>

      <p id="result-desc" class="result-desc"></p>
      
      <div>
        <a id="result-link" class="yt-link" href="" target="_blank" rel="noopener noreferrer">YouTubeでこのシリーズの第1回を観る ▷</a>
      </div>
      <div>
        <button class="retry-btn" onclick="restartQuiz()">もう一度診断する</button>
      </div>
    </div>
  </div>

  <script>
    // 設問ツリーデータ（各設問の選択肢は最大5つ。固有名詞は完全排除）
    const nodes = {
      root: {
        text: "今宵、あなたが画面越しに味わいたい体験はどのようなものでしょうか？",
        image: "images/q_root.png",
        options: [
          { label: "己の反射神経と不屈の精神を試す、王道のアクション", next: "action_1" },
          { label: "照準を定め、弾幕を掻い潜り、火線に身を投じる射撃戦", next: "shooting_1" },
          { label: "重厚な物語に浸り、登場人物の運命に涙するRPGの旅路", next: "rpg_1" },
          { label: "一歩のミスで全てを失う緊張感、あるいは極限の思考パズル", next: "thinking_1" },
          { label: "背筋が凍る恐怖、迷宮入りの事件、あるいは理不尽な奇ゲー", next: "horror_variety_1" }
        ]
      },

      // ── アクション系ツリー ──
      action_1: {
        text: "どのような身体感覚・操作性のアクションを求めていますか？",
        image: "images/q_action.png",
        options: [
          { label: "足場を飛び移り、ゴールを目指す伝統的なジャンプアクション", next: "act_jump" },

          { label: "刃を振るい敵を両断する剣劇、または悪魔を美しく泣かせる近接格闘", next: "act_slash" },
          { label: "触れただけで鎧が弾け飛ぶ、数々の配信者を絶望させた理不尽死にゲー", next: "act_makai" },
          { label: "爆弾を設置してブロックを崩す、あるいはキセル片手に日本中を練り歩く旅", next: "act_bomber_goemon" }
        ]
      },
      act_jump: {
        text: "足場を駆けるジャンプアクション、どの挑戦がお好みですか？",

          { label: "分岐するステージと真のエンディングを求め、シリーズの集大成に挑む第5作", result: "bomber5" }

      // ── シューティング系ツリー ──
      shooting_1: {
        text: "どのような兵装を駆り、どのような空域へ出撃しますか？",
        image: "images/q_shooting.png",
        options: [
          { label: "装甲と重火器を組み換え、火を点け、星の命運を分かつ高速ロボット戦", next: "stg_mecha" },

          { label: "スパイとなって秘密基地に潜入し、任務を遂行するクラシックFPSの金字塔", result: "goldeneye" },
          { label: "異形の生命体兵器を操り、高難度のステージパターンを構築していく名作", result: "rtype" }
        ]
      },
      stg_mecha: {
        text: "硝煙立ち込めるどの戦場で、引き金を引きますか？",
        image: "images/q_shooting.png",
        options: [
          { label: "壁を越え、逆関節のこだわりで3周全ルートを踏破した過酷な惑星の旅", result: "ac6" },

          { label: "リンクス戦争の爪痕。企業の飼い犬となるか、大空の希望を継ぐかの過酷な選択", result: "acfa" }
        ]
      },

      // ── RPG系ツリー ──
      rpg_1: {
        text: "心に残る旅路として、どのような物語の紡ぎ方を求めますか？",
        image: "images/q_rpg.png",
        options: [
          { label: "召喚士の祈りと過酷な運命、あるいはジョブチェンジを駆使する名作RPG", next: "rpg_royal" },
          { label: "世代を超えて受け継がれる皇位と、泥臭い全滅リベンジの歴史", next: "rpg_saga_chrono" },

          { label: "一人の戦士の生き様に情緒を狂わされ、涙と愛憎を叫び続けた名作アニメRPG", result: "db_kakarot" },

      },
      rpg_royal: {
        text: "壮大な大河RPG、どの世界の結末を見届けますか？",

      },
      rpg_saga_chrono: {

          { label: "イベントに失敗し全滅を重ねても、裏での猛特訓を経て強敵を討ち倒す皇帝の歴史", result: "rs2r" },
          { label: "中世から未来、原始へ。滅亡の未来を変えるため時空を駆ける不朽の名作", result: "chrono" },

        ]
      },
      rpg_nuzlocke: {
        text: "命を賭けた縛り旅、どの地方での死闘を見届けますか？",

      // ── 思考・パズル系ツリー ──

          { label: "カードを回し、レリックを吟味し、淡々と心臓を撃破する人生のゲーム", result: "slaythespire" },

    // 質問描画ロジック
    function renderQuestion(nodeId) {
      const node = nodes[nodeId];
      if (!node) return;

      // 氷室うつろ画像の設定
      const charImg = document.getElementById("char-img");
      if (node.image) {
        charImg.src = node.image;
        charImg.style.display = "inline-block";
        charImg.onerror = () => { charImg.style.display = "none"; };
      } else {
        charImg.style.display = "none";
      }

      document.getElementById("question-text").innerText = node.text;
      const optionsContainer = document.getElementById("options-container");
      optionsContainer.innerHTML = "";

      node.options.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerText = opt.label;
        btn.onclick = () => {
          if (opt.result) {
            showResult(opt.result);
          } else if (opt.next) {
            renderQuestion(opt.next);
          }
        };
        optionsContainer.appendChild(btn);
      });
    }

    // 結果表示ロジック（該当シリーズ初回配信のサムネイルを確実に表示）
    function showResult(resultKey) {
      const res = resultsData[resultKey];
      if (!res) return;

      document.getElementById("quiz-area").style.display = "none";
      const resultArea = document.getElementById("result-area");
      resultArea.style.display = "block";

      document.getElementById("result-title").innerText = res.title;
      document.getElementById("result-desc").innerText = res.desc;

      // 当該シリーズ第1回アーカイブのサムネイルを表示
      const thumbImg = document.getElementById("result-thumb");
      thumbImg.src = `https://img.youtube.com/vi/${res.videoId}/hqdefault.jpg`;

      // 当該シリーズ第1回アーカイブへのURLを設定
      const resultLink = document.getElementById("result-link");
      resultLink.href = `https://www.youtube.com/watch?v=${res.videoId}`;
    }

    function restartQuiz() {
      document.getElementById("result-area").style.display = "none";
      document.getElementById("quiz-area").style.display = "block";
      renderQuestion("root");
    }

    // 初期起動
    renderQuestion("root");
  </script>
