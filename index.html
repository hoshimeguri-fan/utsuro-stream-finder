<style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Shippori+Mincho:wght@400;600;700&display=swap');

    :root {
      /* 洋館・夜・氷室うつろカラーパレット */
      --bg-dark: #0b0e14;
      --bg-teal: #16252e;
      --paper-base: #f3f0e8;
      --paper-line: rgba(70, 95, 110, 0.12);
      --frame-gold: #c8b282;
      --frame-gold-glow: #e8d8b5;
      --frame-border: #7c6d53;
      --text-main: #24292e;
      --text-sub: #52606d;
      --btn-base: #1b262c;
      --btn-hover: #293b45;
      --ice-cyan: #7ea3b3;
      --crimson: #8f323a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* 背景：ダイヤ柄（ハーレクイン）＋洋館の夜気グラデーション */
    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(ellipse at 50% 30%, rgba(29, 56, 70, 0.45) 0%, rgba(10, 14, 19, 0.95) 90%),
        repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.015) 0px, rgba(255, 255, 255, 0.015) 20px, transparent 20px, transparent 40px),
        repeating-linear-gradient(-45deg, rgba(0, 0, 0, 0.25) 0px, rgba(0, 0, 0, 0.25) 20px, transparent 20px, transparent 40px);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
      font-family: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
      -webkit-font-smoothing: antialiased;
    }

    /* 洋館の便箋・額縁を模したコンテナ */
    .container {
      width: 100%;
      max-width: 620px;
      background: var(--paper-base);
      background-image: repeating-linear-gradient(
        transparent,
        transparent 31px,
        var(--paper-line) 31px,
        var(--paper-line) 32px
      );
      border: 1px solid var(--frame-gold);
      outline: 4px solid var(--btn-base);
      outline-offset: -7px;
      border-radius: 4px;
      padding: 36px 28px;
      box-shadow: 
        0 0 0 1px rgba(200, 178, 130, 0.4),
        0 20px 45px rgba(0, 0, 0, 0.85);
      position: relative;
    }

    /* 四隅の飾り金具風アクセント */
    .container::before, .container::after {
      content: "✦";
      position: absolute;
      color: var(--frame-gold);
      font-size: 14px;
      line-height: 1;
    }
    .container::before { top: 12px; left: 14px; }
    .container::after { bottom: 12px; right: 14px; }

    header {
      text-align: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px double var(--frame-gold);
      position: relative;
    }

    h1 {
      font-family: 'Cinzel', "Shippori Mincho", serif;
      font-size: 1.35rem;
      letter-spacing: 3px;
      color: #17242c;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.8);
      margin-bottom: 8px;
      font-weight: 700;
    }

    .subtitle {
      font-size: 0.85rem;
      color: var(--text-sub);
      font-style: italic;
      letter-spacing: 1px;
    }

    /* 立ち絵・イメージ枠 */
    .character-img-wrap {
      text-align: center;
      margin-bottom: 18px;
    }

    .character-img {
      max-height: 170px;
      max-width: 100%;
      object-fit: contain;
      filter: drop-shadow(0 6px 10px rgba(10, 20, 30, 0.35));
    }

    /* 設問文 */
    .question-title {
      font-size: 1.05rem;
      font-weight: 600;
      line-height: 1.6;
      margin-bottom: 22px;
      text-align: center;
      color: #12181d;
      letter-spacing: 0.5px;
      padding: 0 10px;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* 選択肢ボタン：アンティークゴールド枠＋ダークネイビー */
    button.option-btn {
      background: var(--btn-base);
      color: #e6ebed;
      border: 1px solid var(--frame-border);
      padding: 13px 18px;
      border-radius: 3px;
      text-align: left;
      font-size: 0.88rem;
      font-family: inherit;
      line-height: 1.45;
      cursor: pointer;
      position: relative;
      transition: all 0.25s ease;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.05), 0 3px 6px rgba(0, 0, 0, 0.25);
    }

    button.option-btn:hover {
      background: var(--btn-hover);
      border-color: var(--frame-gold);
      color: #f7fafc;
      transform: translateY(-2px);
      box-shadow: 
        0 4px 12px rgba(18, 32, 40, 0.35),
        0 0 8px rgba(200, 178, 130, 0.4);
    }

    /* 結果表示エリア */
    .result-box {
      display: none;
      text-align: center;
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .result-badge {
      display: inline-block;
      border: 1px solid var(--frame-gold);
      background: rgba(27, 38, 44, 0.9);
      color: var(--frame-gold-glow);
      font-size: 0.72rem;
      letter-spacing: 2px;
      padding: 4px 14px;
      border-radius: 2px;
      margin-bottom: 14px;
    }

    .result-title {
      font-size: 1.25rem;
      color: #1a2730;
      margin-bottom: 16px;
      line-height: 1.4;
      font-weight: 700;
    }

    .thumb-wrap {
      margin-bottom: 16px;
    }

    .thumb-img {
      width: 100%;
      max-width: 460px;
      border-radius: 3px;
      border: 2px solid var(--frame-gold);
      outline: 1px solid var(--btn-base);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
    }

    .result-desc {
      font-size: 0.88rem;
      color: #313b44;
      line-height: 1.7;
      text-align: left;
      background: rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(124, 109, 83, 0.3);
      border-left: 3px solid var(--frame-gold);
      padding: 14px 16px;
      border-radius: 2px;
      margin-bottom: 22px;
    }

    /* YouTubeリンクボタン：控えめなボルドー調 */
    .yt-link {
      display: inline-block;
      background: var(--crimson);
      color: #f7f3ed;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 3px;
      font-weight: 600;
      font-size: 0.88rem;
      letter-spacing: 1px;
      border: 1px solid #b2535c;
      transition: all 0.2s ease;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
    }

    .yt-link:hover {
      background: #a33c45;
      box-shadow: 0 0 10px rgba(143, 50, 58, 0.5);
    }

    .retry-btn {
      background: transparent;
      color: var(--text-sub);
      border: none;
      border-bottom: 1px solid var(--text-sub);
      padding: 4px 8px;
      cursor: pointer;
      font-size: 0.8rem;
      font-family: inherit;
      margin-top: 18px;
      transition: all 0.2s;
    }

    .retry-btn:hover {
      color: var(--text-main);
      border-bottom-color: var(--text-main);
    }
  </style>
