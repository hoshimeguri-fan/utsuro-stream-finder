<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>氷室うつろ おすすめ配信アーカイブ診断</title>
  <style>
    :root {
      --bg-color: #12141a;
      --card-bg: #1c202a;
      --accent: #5e81ac;
      --accent-hover: #81a1c1;
      --text: #eceff4;
      --text-sub: #d8dee9;
      --border: #2e3440;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
    }
    body {
      background-color: var(--bg-color);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 680px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px 24px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
    }
    header {
      text-align: center;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }
    h1 {
      font-size: 1.4rem;
      color: var(--accent-hover);
      letter-spacing: 1px;
      margin-bottom: 6px;
    }
    .subtitle {
      font-size: 0.85rem;
      color: var(--text-sub);
    }
    .question-box {
      margin-bottom: 24px;
    }
    .question-title {
      font-size: 1.1rem;
      font-weight: 600;
      line-height: 1.6;
      margin-bottom: 20px;
    }
    .options-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    button.option-btn {
      background: #252b38;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 14px 16px;
      border-radius: 8px;
      text-align: left;
      font-size: 0.95rem;
      line-height: 1.4;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    button.option-btn:hover {
      background: var(--accent);
      border-color: var(--accent-hover);
      transform: translateY(-2px);
    }
    .result-box {
      display: none;
      text-align: center;
    }
    .result-badge {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      font-size: 0.75rem;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 12px;
      text-transform: uppercase;
    }
    .result-title {
      font-size: 1.3rem;
      color: #88c0d0;
      margin-bottom: 16px;
      line-height: 1.4;
    }
    .result-desc {
      font-size: 0.95rem;
      color: var(--text-sub);
      line-height: 1.7;
      text-align: left;
      background: #232834;
      padding: 18px;
      border-radius: 8px;
      margin-bottom: 24px;
      border-left: 4px solid var(--accent);
    }
    .links-area {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }
    .yt-link {
      display: inline-block;
      background: #bf616a;
      color: #fff;
      text-decoration: none;
      padding: 12px 18px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.9rem;
      transition: opacity 0.2s ease;
    }
    .yt-link:hover {
      opacity: 0.85;
    }
    .retry-btn {
      background: transparent;
      color: var(--text-sub);
      border: 1px solid var(--border);
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      margin-top: 10px;
    }
    .retry-btn:hover {
      background: var(--border);
    }
  </style>
</head>
<body>

  <div class="container">

    </header>

    <div id="result-area" class="result-box">

      <p id="result-desc" class="result-desc"></p>
      <div id="links-container" class="links-area"></div>
      <button class="retry-btn" onclick="restartQuiz()">もう一度診断する</button>

    // 診断ロジックの描画
    function renderQuestion(nodeId) {
      const node = (nodeId === "root") ? quizTree : nodes[nodeId];
      if (!node) return;

      document.getElementById("question-text").innerText = node.text;
      const optionsContainer = document.getElementById("options-container");
      optionsContainer.innerHTML = "";

      node.options.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerText = opt.label;
        btn.onclick = () => {
          if (opt.result) {
            showResult(opt.result);
          } else if (opt.next) {
            renderQuestion(opt.next);
          }
        };
        optionsContainer.appendChild(btn);
      });
    }

    function showResult(resultKey) {
      const res = resultsData[resultKey];
      if (!res) return;

      document.getElementById("quiz-area").style.display = "none";
      const resultArea = document.getElementById("result-area");
      resultArea.style.display = "block";

      document.getElementById("result-title").innerText = res.title;
      document.getElementById("result-desc").innerText = res.desc;

      const linksContainer = document.getElementById("links-container");
      linksContainer.innerHTML = "";
      if (res.url) {
        const link = document.createElement("a");
        link.className = "yt-link";
        link.href = res.url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.innerText = "YouTubeで配信アーカイブを視聴する ▷";
        linksContainer.appendChild(link);
      }
    }

    function restartQuiz() {
      document.getElementById("result-area").style.display = "none";
      document.getElementById("quiz-area").style.display = "block";
      renderQuestion("root");
    }

    // 初回初期化
    renderQuestion("root");
  </script>
