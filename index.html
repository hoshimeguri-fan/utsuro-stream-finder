    .container {

      border-radius: 8px;
      display: inline-block;

    .question-title {
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.5;
      margin-bottom: 16px;
      text-align: center;

    .options-list {
      display: flex;

      text-align: left;
      font-size: 0.9rem;
      line-height: 1.3;
      cursor: pointer;
      transition: all 0.2s ease;

    button.option-btn:hover {
      background: var(--accent);
      border-color: var(--accent-hover);

    }
    .result-box {
      display: none;
      text-align: center;
    }

      background: var(--accent);
      color: #fff;
      font-size: 0.75rem;
      padding: 3px 12px;
      border-radius: 20px;
      margin-bottom: 12px;
    }
    .result-title {

      color: #88c0d0;
      margin-bottom: 14px;
      line-height: 1.4;

      border: 1px solid var(--border);

    // 質問描画ロジック
    function renderQuestion(nodeId) {
      const node = nodes[nodeId];
      if (!node) return;

      // 氷室うつろ画像の設定
      const charImg = document.getElementById("char-img");
      if (node.image) {
        charImg.src = node.image;
        charImg.style.display = "inline-block";
        charImg.onerror = () => { charImg.style.display = "none"; };
      } else {
        charImg.style.display = "none";
      }

      document.getElementById("question-text").innerText = node.text;
      const optionsContainer = document.getElementById("options-container");
      optionsContainer.innerHTML = "";

      node.options.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerText = opt.label;
        btn.onclick = () => {
          if (opt.result) {
            showResult(opt.result);
          } else if (opt.next) {
            renderQuestion(opt.next);
          }
        };
        optionsContainer.appendChild(btn);
      });
    }

    // 結果表示ロジック（該当シリーズ初回配信のサムネイルを確実に表示）
    function showResult(resultKey) {
      const res = resultsData[resultKey];
      if (!res) return;

      document.getElementById("quiz-area").style.display = "none";
      const resultArea = document.getElementById("result-area");
      resultArea.style.display = "block";

      document.getElementById("result-title").innerText = res.title;
      document.getElementById("result-desc").innerText = res.desc;

      // 当該シリーズ第1回アーカイブのサムネイルを表示
      const thumbImg = document.getElementById("result-thumb");
      thumbImg.src = `https://img.youtube.com/vi/${res.videoId}/hqdefault.jpg`;

      // 当該シリーズ第1回アーカイブへのURLを設定
      const resultLink = document.getElementById("result-link");
      resultLink.href = `https://www.youtube.com/watch?v=${res.videoId}`;
    }

    function restartQuiz() {
      document.getElementById("result-area").style.display = "none";
      document.getElementById("quiz-area").style.display = "block";
      renderQuestion("root");
    }

    // 初期起動
    renderQuestion("root");
  </script>
