<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>氷室うつろ 配信アーカイブ診断</title>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: rgba(22, 27, 34, 0.85);
      --card-border: #30363d;
      --text-main: #c9d1d9;
      --text-title: #f0f6fc;
      --accent-blue: #38bdf8;
      --accent-hover: #0284c7;
      --btn-bg: #21262d;
      --btn-border: #363b42;
      --btn-hover: #30363d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px 16px;
      position: relative;
      overflow-x: hidden;
    }

    /* 背景の雪の結晶エフェクト */
    .snow-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .snowflake {
      position: absolute;
      top: -20px;
      color: #94a3b8;
      opacity: 0.4;
      font-size: 1rem;
      user-select: none;
      animation: fall linear infinite;
    }

    @keyframes fall {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0.5;
      }
      100% {
        transform: translateY(105vh) rotate(360deg);
        opacity: 0;
      }
    }

    /* メインコンテナ */
    .app-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 680px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      backdrop-filter: blur(12px);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.6);
      overflow: hidden;
    }

    /* バナーヘッダー */
    .banner-header {
      width: 100%;
      background: #000;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      max-height: 160px;
    }

    .banner-header img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
    }

    /* コンテンツエリア */
    .content-box {
      padding: 28px 24px 20px;
    }

    .header-title {
      text-align: center;
      margin-bottom: 24px;
    }

    .header-title h1 {
      font-size: 1.4rem;
      color: var(--text-title);
      letter-spacing: 0.08em;
      margin-bottom: 6px;
    }

    .header-title p {
      font-size: 0.88rem;
      color: #8b949e;
    }

    /* 質問画面 */
    .question-box {
      margin-bottom: 24px;
    }

    .question-image-wrap {
      width: 100%;
      max-width: 420px;
      margin: 0 auto 20px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--card-border);
    }

    .question-image-wrap img {
      width: 100%;
      height: auto;
      display: block;
    }

    .question-text {
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--text-title);
      text-align: center;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-btn {
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      color: var(--text-main);
      padding: 14px 18px;
      font-size: 0.95rem;
      text-align: left;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      line-height: 1.4;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .option-btn:hover {
      background: var(--btn-hover);
      border-color: var(--accent-blue);
      color: #fff;
      transform: translateX(4px);
    }

    /* 結果画面 */
    .result-box {
      display: none;
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .result-header {
      text-align: center;
      margin-bottom: 20px;
    }

    .result-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 9999px;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid var(--accent-blue);
      color: var(--accent-blue);
      font-size: 0.8rem;
      font-weight: bold;
      margin-bottom: 10px;
      letter-spacing: 0.05em;
    }

    .result-title {
      font-size: 1.25rem;
      color: var(--text-title);
      line-height: 1.45;
      margin-bottom: 12px;
    }

    .result-desc {
      font-size: 0.92rem;
      color: #8b949e;
      line-height: 1.6;
      margin-bottom: 20px;
      text-align: left;
      background: rgba(13, 17, 23, 0.6);
      padding: 14px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
    }

    /* YouTube埋め込み */
    .video-wrapper {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      margin-bottom: 20px;
      background: #000;
    }

    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* リンクボタン */
    .links-group {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin-bottom: 28px;
    }

    .link-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 20px;
      font-size: 0.9rem;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .link-btn-yt {
      background: #dc2626;
      color: #fff;
    }

    .link-btn-yt:hover {
      background: #b91c1c;
    }

    .link-btn-wiki {
      background: #1f2937;
      color: #93c5fd;
      border: 1px solid #374151;
    }

    .link-btn-wiki:hover {
      background: #374151;
      color: #fff;
    }

    /* もう一度診断するボタン（強調スタイル） */
    .restart-btn-wrap {
      text-align: center;
      margin: 32px 0 24px;
    }

    .restart-btn {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #ffffff;
      font-size: 1.1rem;
      font-weight: bold;
      padding: 14px 40px;
      border: none;
      border-radius: 9999px;
      box-shadow: 0 4px 16px rgba(37, 99, 235, 0.4);
      cursor: pointer;
      transition: all 0.25s ease;
      display: inline-block;
    }

    .restart-btn:hover {
      background: linear-gradient(135deg, #38bdf8, #1d4ed8);
      transform: translateY(-2px);
      box-shadow: 0 6px 22px rgba(37, 99, 235, 0.6);
    }

    /* フッター */
    .footer-notes {
      font-size: 0.78rem;
      color: #6e7681;
      line-height: 1.7;
      text-align: center;
      border-top: 1px solid var(--card-border);
      padding-top: 20px;
      margin-top: 24px;
    }

    .footer-notes a {
      color: var(--accent-blue);
      text-decoration: none;
    }

    .footer-notes a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- 背景の雪エフェクト -->
  <div class="snow-container" id="snow-container"></div>

  <div class="app-container">
    <!-- ヘッダーバナー画像（画像がない場合も崩れません） -->
    <div class="banner-header">
      <img src="images/q_root.png" alt="氷室うつろ" onerror="this.style.display='none';">
    </div>

    <div class="content-box">
      <div class="header-title">
        <h1>氷室うつろ 配信アーカイブ診断</h1>
        <p>― ご主人様、今の気分に合わせてお選びください ―</p>
      </div>

      <!-- 質問画面 -->
      <div id="quiz-box" class="question-box">
        <div id="q-image-wrap" class="question-image-wrap" style="display: none;">
          <img id="q-image" src="" alt="設問イメージ">
        </div>
        <div id="q-text" class="question-text">読み込み中でございます…</div>
        <div id="q-options" class="options-list"></div>
      </div>

      <!-- 結果画面 -->
      <div id="result-box" class="result-box">
        <div class="result-header">
          <span class="result-badge">おすすめのアーカイブ</span>
          <h2 id="r-title" class="result-title"></h2>
        </div>
        
        <p id="r-desc" class="result-desc"></p>

        <!-- YouTube 埋め込みプレイヤー -->
        <div class="video-wrapper">
          <iframe id="r-iframe" src="" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>
        </div>

        <div class="links-group">
          <a id="r-yt-link" href="#" target="_blank" rel="noopener noreferrer" class="link-btn link-btn-yt">YouTubeで直接視聴する</a>
          <a id="r-wiki-link" href="#" target="_blank" rel="noopener noreferrer" class="link-btn link-btn-wiki">非公式Wikiの記録を見る</a>
        </div>

        <!-- 1. もう一度診断するボタン -->
        <div class="restart-btn-wrap">
          <button class="restart-btn" onclick="restartQuiz()">もう一度診断する</button>
        </div>

        <!-- 2. ファンメイド表記 / 3. 非公式wiki表記 / 4. お問い合わせ -->
        <footer class="footer-notes">
          <p>※当診断はファンメイドの非公式企画であり、星めぐり学園公式および所属ライバーとは一切関係ございません。</p>
          <p>※紹介している非公式wikiの文章・まとめは、当診断の作成者ではなく有志のリスナー様方によって執筆・編集されたものです。</p>
          <p style="margin-top: 6px;">お問い合わせ・ご意見は X: <a href="https://x.com/yatatatatan" target="_blank" rel="noopener noreferrer">@yatatatatan</a> までお願いいたします。</p>
        </footer>
      </div>
    </div>
  </div>

  <!-- 外部スクリプトの読み込み -->
  <script src="tree.js"></script>
  <script src="results.js"></script>

  <script>
    // 雪の結晶を生成
    function createSnowflakes() {
      const container = document.getElementById('snow-container');
      const count = 28;
      for (let i = 0; i < count; i++) {
        const flake = document.createElement('div');
        flake.className = 'snowflake';
        flake.textContent = '❄';
        flake.style.left = Math.random() * 100 + 'vw';
        flake.style.animationDuration = (Math.random() * 5 + 5) + 's';
        flake.style.animationDelay = (Math.random() * 5) + 's';
        flake.style.fontSize = (Math.random() * 0.9 + 0.6) + 'rem';
        container.appendChild(flake);
      }
    }
    createSnowflakes();

    // 診断の進行管理
    let currentNodeKey = 'root';

    function showNode(key) {
      if (typeof nodes === 'undefined') {
        alert('tree.js が正しく読み込まれておりません。');
        return;
      }

      const node = nodes[key];
      if (!node) {
        alert('エラー：指定された質問が見つかりませんでした (' + key + ')');
        return;
      }

      currentNodeKey = key;

      // 画像の切り替え（画像が存在する場合のみ表示）
      const qImageWrap = document.getElementById('q-image-wrap');
      const qImage = document.getElementById('q-image');
      if (node.image) {
        qImage.src = node.image;
        qImage.onload = () => { qImageWrap.style.display = 'block'; };
        qImage.onerror = () => { qImageWrap.style.display = 'none'; };
      } else {
        qImageWrap.style.display = 'none';
      }

      document.getElementById('q-text').textContent = node.text;

      const optionsContainer = document.getElementById('q-options');
      optionsContainer.innerHTML = '';

      node.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = `<span>${opt.label}</span><span style="opacity:0.5; font-size:1.1rem;">›</span>`;
        btn.onclick = () => {
          if (opt.next) {
            showNode(opt.next);
          } else if (opt.result) {
            showResult(opt.result);
          }
        };
        optionsContainer.appendChild(btn);
      });
    }

    function showResult(resultKey) {
      if (typeof resultsData === 'undefined') {
        alert('results.js が正しく読み込まれておりません。');
        return;
      }

      const data = resultsData[resultKey];
      if (!data) {
        alert('エラー：該当する診断結果データが見つかりませんでした (' + resultKey + ')');
        return;
      }

      document.getElementById('quiz-box').style.display = 'none';
      const rBox = document.getElementById('result-box');
      rBox.style.display = 'block';

      document.getElementById('r-title').textContent = data.title;
      document.getElementById('r-desc').textContent = data.desc || '';
      document.getElementById('r-iframe').src = `https://www.youtube.com/embed/${data.videoId}?rel=0`;
      document.getElementById('r-yt-link').href = `https://www.youtube.com/watch?v=${data.videoId}`;

      // Wikiリンク生成
      let wikiUrl = '#';
      if (data.wikiPath) {
        if (data.wikiPath.startsWith('http')) {
          wikiUrl = data.wikiPath;
        } else {
          wikiUrl = `https://seesaawiki.jp/himuroutsuro/d/${encodeURIComponent(data.wikiPath)}`;
        }
      }
      document.getElementById('r-wiki-link').href = wikiUrl;

      // ページ最上部へスクロール
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function restartQuiz() {
      // 埋め込み動画を停止
      document.getElementById('r-iframe').src = '';
      document.getElementById('result-box').style.display = 'none';
      document.getElementById('quiz-box').style.display = 'block';
      showNode('root');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 初回起動
    window.addEventListener('DOMContentLoaded', () => {
      showNode('root');
    });
  </script>
</body>
</html>
