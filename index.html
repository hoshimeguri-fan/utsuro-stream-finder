  <script>
    (function initSnow() {
      const canvas = document.getElementById('snow-canvas');
      const ctx = canvas.getContext('2d');
      let width, height;

      function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      const snowflakeTypes = ['❄', '❅', '✦'];
      const flakeCount = Math.floor(Math.min(width, 1400) / 18);
      const flakes = [];

      for (let i = 0; i < flakeCount; i++) {
        flakes.push({
          x: Math.random() * width,
          y: Math.random() * height,
          size: Math.random() * 16 + 18,
          type: snowflakeTypes[Math.floor(Math.random() * snowflakeTypes.length)],
          speedY: Math.random() * 0.8 + 0.45,
          speedX: Math.random() * 0.4 - 0.2,
          swingAngle: Math.random() * Math.PI * 2,
          swingSpeed: Math.random() * 0.02 + 0.01,
          opacity: Math.random() * 0.4 + 0.45,
          twinkleSpeed: Math.random() * 0.035 + 0.02,
          twinklePhase: Math.random() * Math.PI * 2
        });
      }

      function renderSnow() {
        ctx.clearRect(0, 0, width, height);

        flakes.forEach(flake => {
          flake.y += flake.speedY;
          flake.swingAngle += flake.swingSpeed;
          flake.x += Math.sin(flake.swingAngle) * 0.75 + flake.speedX;
          flake.twinklePhase += flake.twinkleSpeed;

          const currentAlpha = Math.min(1.0, Math.max(0.25, flake.opacity + Math.sin(flake.twinklePhase) * 0.3));

          if (flake.y > height + 30) {
            flake.y = -30;
            flake.x = Math.random() * width;
          }
          if (flake.x > width + 30) flake.x = -30;
          if (flake.x < -30) flake.x = width + 30;

          ctx.save();
          ctx.font = `${flake.size}px serif`;
          
          if (flake.type === '✦') {
            ctx.fillStyle = `rgba(238, 224, 192, ${currentAlpha * 0.95})`;
            ctx.shadowBlur = 10;
            ctx.shadowColor = 'rgba(238, 224, 192, 0.6)';
          } else {
            ctx.fillStyle = `rgba(195, 225, 240, ${currentAlpha * 0.9})`;
            ctx.shadowBlur = 12;
            ctx.shadowColor = 'rgba(175, 215, 235, 0.55)';
          }

          ctx.fillText(flake.type, flake.x, flake.y);
          ctx.restore();
        });

        requestAnimationFrame(renderSnow);
      }
      requestAnimationFrame(renderSnow);
    })();

    let stepHistory = [];

    // 12時間耐久（8192）ルート管理用変数（全6問）
    let is12HoursMode = false;
    let trialStep = 1;
    const trialTexts = {
      1: "12時間を共に過ごすならどちらか正解を選んでください",
      2: "まずは正解ですね。次をどうぞ。",
      3: "ここまでは来れるんですよね。さぁ次をどうぞ。",
      4: "すばらしい。では次をどうぞ。",
      5: "そろそろ終わりかと思いました？まだです。次をどうぞ。",
      6: "よくここまで来られましたね。次は緑が正解…かもですよ？"
    };

    function start12HoursTrial() {
      is12HoursMode = true;
      trialStep = 1;
      document.getElementById("gacha-container").style.display = "none";
      document.getElementById("back-step-btn").style.display = "none";
      render12HoursQuestion();
    }

    function render12HoursQuestion() {
      document.getElementById("question-text").innerText = trialTexts[trialStep];
      const optionsContainer = document.getElementById("options-container");
      optionsContainer.innerHTML = "";

      // 毎問ごとに「緑」か「青」のどちらか片方が完全ランダムで正解（1/2）
      const correctColor = Math.random() < 0.5 ? "green" : "blue";

      // 選択肢の表示順は常に上が緑、下が青で固定
      const choices = [
        { label: "緑の扉", color: "green", isCorrect: (correctColor === "green") },
        { label: "青の扉", color: "blue", isCorrect: (correctColor === "blue") }
      ];

      choices.forEach(ch => {
        const btn = document.createElement("button");
        btn.className = "option-btn " + (ch.color === "green" ? "btn-door-green" : "btn-door-blue");
        btn.innerText = ch.label;
        btn.onclick = () => {
          if (ch.isCorrect) {
            if (trialStep === 6) {
              is12HoursMode = false;
              showResult("hours12_8192");
            } else {
              trialStep++;
              render12HoursQuestion();
            }
          } else {
            // 不正解時は即座にトップ画面へ初期化
            restartQuiz();
          }
        };
        optionsContainer.appendChild(btn);
      });
    }

    function renderQuestion(nodeId, isBack = false) {
      const node = nodes[nodeId];
      if (!node) return;

      if (!isBack) {
        stepHistory.push(nodeId);
      }

      document.getElementById("wiki-credit-line").style.display = "none";

      const backBtn = document.getElementById("back-step-btn");
      if (stepHistory.length > 1) {
        backBtn.style.display = "inline-block";
      } else {
        backBtn.style.display = "none";
      }

      const gachaBox = document.getElementById("gacha-container");
      if (gachaBox) {
        gachaBox.style.display = (nodeId === "root") ? "block" : "none";
      }

      const charImg = document.getElementById("char-img");
      if (node.image) {
        charImg.src = node.image;
        charImg.style.display = "inline-block";
        charImg.onerror = () => { charImg.style.display = "none"; };
      } else {
        charImg.style.display = "none";
      }

      document.getElementById("question-text").innerText = node.text;
      const optionsContainer = document.getElementById("options-container");
      optionsContainer.innerHTML = "";

      node.options.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerText = opt.label;
        btn.onclick = () => {
          if (opt.customAction === "start12Hours") {
            start12HoursTrial();
          } else if (opt.result) {
            showResult(opt.result);
          } else if (opt.next) {
            renderQuestion(opt.next);
          }
        };
        optionsContainer.appendChild(btn);
      });
    }

    function goBackStep() {
      if (stepHistory.length > 1) {
        stepHistory.pop();
        const prevNodeId = stepHistory[stepHistory.length - 1];
        renderQuestion(prevNodeId, true);
      }
    }

    function triggerGacha() {
      if (typeof resultsData === 'undefined') {
        alert("results.js が読み込まれておりません。");
        return;
      }
      const keys = Object.keys(resultsData);
      if (keys.length === 0) return;
      const randomKey = keys[Math.floor(Math.random() * keys.length)];
      showResult(randomKey);
    }

    function showResult(resultKey) {
      const res = resultsData[resultKey];
      if (!res) {
        console.error("Missing result key:", resultKey);
        alert("エラー：該当する診断結果データが見つかりませんでした (" + resultKey + ")");
        return;
      }

      document.getElementById("quiz-area").style.display = "none";
      const resultArea = document.getElementById("result-area");
      resultArea.style.display = "block";

      document.getElementById("wiki-credit-line").style.display = "block";

      const badgeEl = document.getElementById("result-badge");
      if (resultKey === "hours12_8192") {
        badgeEl.innerText = "涅槃への道が開かれました";
      } else {
        badgeEl.innerText = "おすすめのアーカイブ";
      }

      document.getElementById("result-title").innerText = res.title;
      document.getElementById("result-desc").innerText = res.desc;

      const thumbImg = document.getElementById("result-thumb");
      thumbImg.src = `https://img.youtube.com/vi/${res.videoId}/hqdefault.jpg`;

      const videoUrl = `https://www.youtube.com/watch?v=${res.videoId}`;
      const resultLink = document.getElementById("result-link");
      resultLink.href = videoUrl;

      const wikiLink = document.getElementById("wiki-link");
      if (res.wikiPath) {
        if (res.wikiPath.startsWith('http')) {
          wikiLink.href = res.wikiPath;
        } else {
          let cleanPath = res.wikiPath;
          if (cleanPath.startsWith('動画一覧/')) {
            cleanPath = cleanPath.replace('動画一覧/', '');
          }
          wikiLink.href = `https://wikiwiki.jp/utsurohimuro/%E5%8B%95%E7%94%BB%E4%B8%80%E8%A6%A7/${encodeURIComponent(cleanPath)}`;
        }
        wikiLink.style.display = "inline-flex";
      } else {
        wikiLink.style.display = "none";
      }

      // 診断サイト自体のURL
      const siteUrl = "https://hoshimeguri-fan.github.io/utsuro-stream-finder/";

      // 履修状況に応じたXシェアリンク
      // ※YouTube動画URL（videoUrl）をパラメータの第一優先にすることで確実に動画サムネイルをカード化
      const watchedText = `【氷室うつろ 配信アーカイブ診断】\n『${res.title}』\n＼ 履修済みでございます！ ／\n\n診断はこちら：${siteUrl}\n#氷室うつろアーカイブ診断`;
      const unwatchedText = `【氷室うつろ 配信アーカイブ診断】\n『${res.title}』\n＼ これから観るぞ！ ／\n\n診断はこちら：${siteUrl}\n#氷室うつろアーカイブ診断`;

      const watchedUrl = `https://twitter.com/intent/tweet?url=${encodeURIComponent(videoUrl)}&text=${encodeURIComponent(watchedText)}`;
      const unwatchedUrl = `https://twitter.com/intent/tweet?url=${encodeURIComponent(videoUrl)}&text=${encodeURIComponent(unwatchedText)}`;

      document.getElementById("post-watched-btn").href = watchedUrl;
      document.getElementById("post-unwatched-btn").href = unwatchedUrl;
      
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function restartQuiz() {
      is12HoursMode = false;
      trialStep = 1;
      document.getElementById("result-area").style.display = "none";
      document.getElementById("quiz-area").style.display = "block";
      document.getElementById("wiki-credit-line").style.display = "none";
      stepHistory = [];
      renderQuestion("root");
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    renderQuestion("root");
  </script>
</body>
</html>
